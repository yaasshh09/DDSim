app = 'ddsim'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
