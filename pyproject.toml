[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsim"
version = "0.1.0"
description = "Drift-diffusion semiconductor device simulator"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy-stubs>=1.15",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["ddsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ddsim"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  # Protocol method bodies are declarations, never executed.
  '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
# Physics symbols win over PEP8 naming. Names match docs/01-physics.md
# exactly: V_T, Eg, Nc, Nv, B, Nd, Na, psi.
ignore = ["N802", "N803", "N806", "N812", "N815", "N816"]

[tool.mypy]
# No python_version pin. numpy 2.5 stubs use 3.12+ syntax, so mypy runs on the
# interpreter it is installed under, in a single CI job rather than the matrix.
files = ["ddsim"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
