[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsim"
version = "0.1.0"
description = "Drift-diffusion semiconductor device simulator"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy-stubs>=1.15",
  "matplotlib>=3.8",
  "ddsim[serve]",
  "httpx2>=0.29",
  "playwright>=1.45",
  "fonttools>=4.50",
]

[project.scripts]
ddsim = "ddsim.cli:main"

[tool.setuptools.packages.find]
include = ["ddsim*"]

[tool.setuptools.package-data]
ddsim = [
  "api/static/*.html",
  "api/static/css/*.css",
  "api/static/js/*.js",
  "api/static/learn/*.md",
  "api/lessons/*.md",
  "api/static/vendor/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["ddsim"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  '^\s*\.\.\.$',
  '^\s*except queue\.Empty:$',
  '^\s*if run is None:$',
  '^if __name__ == "__main__":$',
  '^\s*if not \(np\.all\(np\.isfinite\(n\)\) and np\.all\(np\.isfinite\(p\)\)\):$',
  '^\s*if np\.any\(high > 1e6\):$',
  '^\s*if best_score > best_bound \* \(1\.0 \+ _SCORE_SLACK\):$',
  '^\s*if short:$',
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
ignore = ["N802", "N803", "N806", "N812", "N815", "N816"]

[tool.ruff.lint.per-file-ignores]
"tests/analytic/test_band_diagram_plot.py" = ["E402"]
"tests/analytic/test_iv_plot.py" = ["E402"]
"tests/analytic/test_mos_cv_plot.py" = ["E402"]
"tests/analytic/test_mosfet_rolloff_plot.py" = ["E402"]
"tests/analytic/test_mosfet_transfer_plot.py" = ["E402"]
"tests/regression/devsim_gen/generate_diodes.py" = ["E402"]
"tests/regression/devsim_gen/generate_mos_cv.py" = ["E402"]
"tests/regression/devsim_gen/generate_mosfet.py" = ["E402"]
"tests/regression/devsim_gen/scoreboard.py" = ["E402"]

[tool.mypy]
files = ["ddsim"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
