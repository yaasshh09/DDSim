[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsim"
version = "0.1.0"
description = "Drift-diffusion semiconductor device simulator"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
# The solver does not need these and a clone that only wants to run pytest
# should not install them. `pip install -e .` stays numpy and scipy.
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy-stubs>=1.15",
  "matplotlib>=3.8",
  # dev carries serve so that CI runs the API tests rather than skipping them.
  # An API whose tests are conditional is an API that breaks unnoticed.
  "ddsim[serve]",
  # starlette's TestClient asks for httpx2 now, and this project turns
  # warnings into errors, so the old httpx is not an option here.
  "httpx2>=0.29",
]

[project.scripts]
ddsim = "ddsim.cli:main"

[tool.setuptools.packages.find]
include = ["ddsim*"]

[tool.setuptools.package-data]
# The browser client ships with the package. It is the whole of the frontend
# and there is no build step, so an installed ddsim can serve it.
ddsim = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error",
  # starlette's TestClient reaches a deprecated anyio alias while importing,
  # which is not this project's code and not something this project can fix.
  # Ignored by its exact message so that the gate stays on for everything
  # else, including any warning the solver itself ever raises.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["ddsim"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  # Protocol method bodies are declarations, never executed.
  '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
# Physics symbols win over PEP8 naming. Names match docs/01-physics.md
# exactly: V_T, Eg, Nc, Nv, B, Nd, Na, psi.
ignore = ["N802", "N803", "N806", "N812", "N815", "N816"]

[tool.mypy]
# No python_version pin. numpy 2.5 stubs use 3.12+ syntax, so mypy runs on the
# interpreter it is installed under, in a single CI job rather than the matrix.
files = ["ddsim"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
